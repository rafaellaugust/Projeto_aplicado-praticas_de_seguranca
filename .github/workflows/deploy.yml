name: Deploy para Produção

on:
  push:
    branches: [main]

jobs:
  # Verificação de segurança do código
  security-check:
    name: Verificação de Segurança
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verificar vazamento de credenciais
        run: |
          echo "🔍 Verificando vazamento de credenciais..."
          # Verifica se há senhas ou tokens hardcoded
          if grep -rn 'DB_PASS.*=.*[A-Za-z0-9]' config.php --include='*.php' | grep -v 'getenv\|\?\:' | grep -v '.env'; then
            echo "❌ ALERTA: Possível credencial hardcoded encontrada!"
            exit 1
          fi
          echo "✅ Nenhuma credencial exposta encontrada."

      - name: Verificar arquivos sensíveis
        run: |
          echo "🔍 Verificando arquivos sensíveis no repositório..."
          # 1. Bloqueia qualquer arquivo .env
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "❌ ALERTA: Arquivo de ambiente .env encontrado no repositório!"
            exit 1
          fi
          # 2. Bloqueia dumps SQL fora do diretório de migrações estruturais
          if git ls-files | grep -v '^migrations/' | grep -E '\.sql$'; then
            echo "❌ ALERTA: Dump SQL sensível fora de migrations encontrado no repositório!"
            exit 1
          fi
          # 3. Bloqueia arquivos de log
          if git ls-files | grep -E '\.log$'; then
            echo "❌ ALERTA: Arquivo de log encontrado no repositório!"
            exit 1
          fi
          # 4. Bloqueia chaves privadas ou backups compactados
          if git ls-files | grep -E '\.(pem|key|id_rsa|zip|tar|gz)$'; then
            echo "❌ ALERTA: Chave privada ou arquivo compactado encontrado no repositório!"
            exit 1
          fi
          echo "✅ Nenhum arquivo sensível ou credencial exposta no repositório."

  # Deploy para o servidor de produção
  deploy:
    name: Deploy Seguro via SSH
    needs: security-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST || '100.63.31.242' }}
          username: ${{ secrets.SERVER_USER || 'ubuntu' }}
          key: ${{ secrets.SSH_PRIVATE_KEY || secrets.AWSPROJETO || secrets.AWSPROJETONOVA }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            echo "📦 Iniciando deploy..."
            if [ -d "/var/www/html/.git" ]; then
              TARGET_DIR="/var/www/html"
            elif [ -d "/var/www/html/aplicacao/.git" ]; then
              TARGET_DIR="/var/www/html/aplicacao"
            else
              TARGET_DIR="/var/www/html"
            fi
            echo "📁 Diretório alvo: $TARGET_DIR"
            cd "$TARGET_DIR"
            
            # Backup antes do deploy
            echo "💾 Criando backup..."
            sudo cp -r . ../backup_deploy_$(date +%Y%m%d_%H%M%S) 2>/dev/null || true
            
            # Pull das alterações
            echo "🔄 Atualizando código..."
            git config --global --add safe.directory "$TARGET_DIR" 2>/dev/null || true
            git fetch origin main
            git reset --hard origin/main
            
            # Limpeza preventiva de dumps acidentais na raiz da VM
            echo "🧹 Removendo resquícios de arquivos sensíveis na VM..."
            sudo rm -f *.sql "spaconet_aplicacao*.sql" "corrigir_banco*.sql" "banco_dados*.sql" "schema-only.sql" 2>/dev/null || true
            
            # Garantir permissões corretas
            echo "🔒 Configurando permissões..."
            sudo chown -R www-data:www-data /var/www/html
            sudo chmod -R 755 /var/www/html
            [ -f /var/www/html/.env ] && sudo chmod 640 /var/www/html/.env || true
            [ -d /var/www/html/log ] && sudo chmod -R 770 /var/www/html/log/ || true
            [ -d /var/www/html/backups ] && sudo chmod -R 770 /var/www/html/backups/ || true
            sudo chown -R ubuntu:ubuntu /home/ubuntu/.ssh
            sudo chmod 700 /home/ubuntu/.ssh
            sudo chmod 600 /home/ubuntu/.ssh/authorized_keys
            
            # Restart/Reload dos serviços
            echo "🔄 Recarregando serviços web..."
            sudo systemctl reload apache2 || sudo systemctl reload nginx || true
            sudo systemctl reload php8.1-fpm || sudo systemctl reload php8.3-fpm || true
            
            echo "✅ Deploy concluído com sucesso!"
